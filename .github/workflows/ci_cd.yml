name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: tracknest
        env:
          BOT_TOKEN: dummy_token_for_tests
          DASHBOARD_PASSWORD: dummy_password_for_tests
        run: pytest tests/

      - name: Note
        run: echo "Telegram connection is verified in the 'Deploy' job (push to main only)."

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are present
        env:
          BOT_TOKEN: ${{ secrets.TRACKNEST_TELEGRAM_BOT_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.TRACKNEST_DASHBOARD_PASSWORD }}
        run: |
          if [ -z "${BOT_TOKEN}" ]; then echo "Missing secret: TRACKNEST_TELEGRAM_BOT_TOKEN" && exit 1; fi
          if [ -z "${DASHBOARD_PASSWORD}" ]; then echo "Missing secret: TRACKNEST_DASHBOARD_PASSWORD" && exit 1; fi
          echo "BOT_TOKEN present."
          echo "DASHBOARD_PASSWORD present."

      - name: Test Telegram connection
        env:
          BOT_TOKEN: ${{ secrets.TRACKNEST_TELEGRAM_BOT_TOKEN }}
        run: |
          echo "=== Testing Telegram Bot Connection ==="
          response=$(curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/getMe" 2>/dev/null)
          if echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok']"; then
            echo "Telegram connection OK"
            echo "$response" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"Bot: @{d['result']['username']}\")"
          else
            echo "Telegram connection FAILED: $response"
            exit 1
          fi
          echo "======================================="

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/andreia-fa/tracknest_bot:latest
            ghcr.io/andreia-fa/tracknest_bot:${{ github.sha }}

      # Runs on the Oracle VM. Docker itself needs no inbound port (the bot
      # long-polls Telegram, and /dashboard's aiohttp server binds to
      # 127.0.0.1 inside the container, reached only via the cloudflared
      # subprocess it also runs) — see DEPLOY_STRATEGY.md for VM/firewall
      # notes. Re-authenticates to GHCR each deploy with the run's own
      # short-lived GITHUB_TOKEN rather than a separate registry secret.
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          BOT_TOKEN: ${{ secrets.TRACKNEST_TELEGRAM_BOT_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.TRACKNEST_DASHBOARD_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN,GH_ACTOR,BOT_TOKEN,DASHBOARD_PASSWORD
          script: |
            set -euo pipefail
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker pull ghcr.io/andreia-fa/tracknest_bot:latest
            docker stop tracknest-bot 2>/dev/null || true
            docker rm tracknest-bot 2>/dev/null || true
            mkdir -p /home/ubuntu/tracknest-data
            docker run -d --name tracknest-bot --restart unless-stopped \
              -e BOT_TOKEN="$BOT_TOKEN" \
              -e DASHBOARD_PASSWORD="$DASHBOARD_PASSWORD" \
              -v /home/ubuntu/tracknest-data:/app/data \
              ghcr.io/andreia-fa/tracknest_bot:latest
